name: repair-release-tags

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'repair-release-tags'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace bootstrap releases with canonical tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for bad in "3/merge" "4/merge"; do
            if gh release view "$bad" >/dev/null 2>&1; then
              gh release delete "$bad" --cleanup-tag --yes
            fi
          done
          for tag in "rsos-v0.5.1" "rbsr-v0.2.2"; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already exists"
            else
              gh release create "$tag" --target main --title "$tag" --generate-notes
            fi
          done
