name: rbsr mutation validation

on:
  pull_request:

permissions:
  contents: read

# rerun after bounded traversal refactor

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: cargo generate-lockfile
      - name: Run stable RBSR mutations
        run: |
          set -euo pipefail
          cargo mutants -p rbsr             --exclude 'rbsr/src/probe_harness.rs'             --exclude 'rbsr/src/policy/constant_stride_split.rs'             --exclude 'rbsr/src/policy/span_hashed_stride_split.rs'             --exclude-re 'local_for_testing|remote_for_testing'             --cargo-arg=--locked             --jobs 2             --no-shuffle             --caught             --unviable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbsr-stable-validation
          path: mutants.out
          if-no-files-found: ignore

  internal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RUSTFLAGS: --cfg rbsr_internal_testing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: cargo generate-lockfile
      - name: Run internal RBSR mutations
        run: |
          set -euo pipefail
          cargo mutants -p rbsr             --file 'rbsr/src/probe_harness.rs'             --file 'rbsr/src/policy/constant_stride_split.rs'             --file 'rbsr/src/policy/span_hashed_stride_split.rs'             --examine-re 'local_for_testing|remote_for_testing|probe_harness|constant_stride_split|span_hashed_stride_split'             --test-workspace=true             --cargo-arg=--locked             --jobs 2             --no-shuffle             --caught             --unviable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbsr-internal-validation
          path: mutants.out
          if-no-files-found: ignore
