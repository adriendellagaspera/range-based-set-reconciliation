name: issue47-paired

on:
  pull_request:
    paths:
      - 'rsos/**'
      - 'rbsr/**'
      - '.github/workflows/issue47-paired.yml'

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -Dwarnings

jobs:
  paired:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: before
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: after
      - uses: dtolnay/rust-toolchain@stable

      - name: Install deterministic operation and RSS probes
        shell: bash
        run: |
          set -euo pipefail
          for variant in before after; do
            mkdir -p "$variant/rsos/examples"
            cat > "$variant/rsos/examples/issue47_probe.rs" <<'RS'
          use rsos::FingerprintTreeMap;
          use std::hint::black_box;
          use std::time::Instant;

          const N: u32 = 100_000;
          const OPS: u32 = 20_000;
          const REPS: usize = 7;

          fn key(i: u32) -> u32 {
              i.wrapping_mul(7_919).wrapping_add(104_729) % N
          }

          fn median(mut samples: Vec<u128>) -> u128 {
              samples.sort_unstable();
              samples[samples.len() / 2]
          }

          fn report(name: &str, samples: Vec<u128>, ops: u32) {
              let total = median(samples);
              println!(
                  "[issue47_probe] {name}: median_total_ns={total}, ops={ops}, ns_per_op={:.2}",
                  total as f64 / ops as f64
              );
          }

          fn rss_kib() -> usize {
              std::fs::read_to_string("/proc/self/status")
                  .expect("/proc/self/status")
                  .lines()
                  .find_map(|line| {
                      line.strip_prefix("VmRSS:")
                          .and_then(|rest| rest.split_whitespace().next())
                          .and_then(|value| value.parse().ok())
                  })
                  .expect("VmRSS")
          }

          fn main() {
              let items: Vec<(u32, u32)> = (0..N).map(|k| (k, k)).collect();

              let mut fill = Vec::with_capacity(REPS);
              for _ in 0..REPS {
                  let start = Instant::now();
                  let mut tree = FingerprintTreeMap::new();
                  for &(k, v) in &items {
                      tree.insert(k, v);
                  }
                  black_box(tree.aggregate(..));
                  fill.push(start.elapsed().as_nanos());
              }
              report("serial_fill", fill, N);

              let mut overwrite = Vec::with_capacity(REPS);
              for rep in 0..REPS {
                  let mut tree: FingerprintTreeMap<u32, u32> =
                      items.iter().copied().collect();
                  let start = Instant::now();
                  for i in 0..OPS {
                      let k = key(i);
                      black_box(tree.insert(k, k ^ (rep as u32 + 1)));
                  }
                  overwrite.push(start.elapsed().as_nanos());
              }
              report("overwrite_existing", overwrite, OPS);

              let mut remove_insert = Vec::with_capacity(REPS);
              for _ in 0..REPS {
                  let mut tree: FingerprintTreeMap<u32, u32> =
                      items.iter().copied().collect();
                  let start = Instant::now();
                  for i in 0..OPS {
                      let k = key(i);
                      black_box(tree.remove(&k));
                      black_box(tree.insert(k, k));
                  }
                  remove_insert.push(start.elapsed().as_nanos());
              }
              report("remove_insert", remove_insert, OPS);

              let mut with_mut = Vec::with_capacity(REPS);
              for rep in 0..REPS {
                  let mut tree: FingerprintTreeMap<u32, u32> =
                      items.iter().copied().collect();
                  let start = Instant::now();
                  for i in 0..OPS {
                      let k = key(i);
                      tree.with_mut(&k, |value| {
                          if let Some(value) = value {
                              *value ^= rep as u32 + 1;
                          }
                      });
                  }
                  with_mut.push(start.elapsed().as_nanos());
              }
              report("with_mut", with_mut, OPS);

              let tree: FingerprintTreeMap<u32, u32> = items.iter().copied().collect();
              let mut aggregate = Vec::with_capacity(REPS);
              for rep in 0..REPS {
                  let start = Instant::now();
                  for i in 0..OPS {
                      let lo = key(i.wrapping_add(rep as u32));
                      let hi = lo.saturating_add(1_024).min(N);
                      black_box(tree.aggregate(lo..hi));
                  }
                  aggregate.push(start.elapsed().as_nanos());
              }
              report("aggregate_1024", aggregate, OPS);

              let before = rss_kib();
              let mut large = FingerprintTreeMap::new();
              for k in 0..500_000u32 {
                  large.insert(k, k);
              }
              black_box(large.aggregate(..));
              let after = rss_kib();
              println!(
                  "[issue47_rss] n=500000 before_kib={before} after_kib={after} delta_kib={}",
                  after.saturating_sub(before)
              );
              black_box(&large);
          }
          RS
            cat > "$variant/rsos/examples/issue47_cow.rs" <<'RS'
          use rsos::FingerprintTreeMap;
          use std::hint::black_box;
          use std::time::Instant;

          const N: u32 = 100_000;
          const CHANGED: u32 = 1_000;

          fn key(i: u32) -> u32 {
              i.wrapping_mul(7_919).wrapping_add(104_729) % N
          }

          fn rss_kib() -> usize {
              std::fs::read_to_string("/proc/self/status")
                  .expect("/proc/self/status")
                  .lines()
                  .find_map(|line| {
                      line.strip_prefix("VmRSS:")
                          .and_then(|rest| rest.split_whitespace().next())
                          .and_then(|value| value.parse().ok())
                  })
                  .expect("VmRSS")
          }

          fn main() {
              let mut tree: FingerprintTreeMap<u32, u32> =
                  (0..N).map(|k| (k, k)).collect();
              let pinned = tree.clone();
              black_box(pinned.aggregate(..));
              let before = rss_kib();
              let start = Instant::now();
              for i in 0..CHANGED {
                  let k = key(i);
                  black_box(tree.insert(k, k ^ 1));
              }
              let elapsed = start.elapsed().as_nanos();
              let after = rss_kib();
              println!(
                  "[issue47_cow] n={N} changed={CHANGED} delta_kib={} ns_per_change={:.2}",
                  after.saturating_sub(before),
                  elapsed as f64 / CHANGED as f64
              );
              black_box(&pinned);
              black_box(&tree);
          }
          RS
          done

      - name: Run paired structural and operation probes
        shell: bash
        run: |
          set -euo pipefail
          for variant in before after; do
            echo "=== $variant: structural footprint ==="
            (
              cd "$variant"
              RECONCILE_BASELINE_SIZES=100000 cargo test -p rsos --lib node_occupancy -- --ignored --nocapture
            )
            echo "=== $variant: operation timings and RSS ==="
            (
              cd "$variant"
              cargo run --release -p rsos --example issue47_probe
              cargo run --release -p rsos --example issue47_cow
            )
          done

      - name: Run paired end-to-end RBSR protocol benchmark
        shell: bash
        run: |
          set -euo pipefail
          for variant in before after; do
            echo "=== $variant: RBSR n=100000 d=100 ==="
            (
              cd "$variant"
              cargo bench -p rbsr --bench protocol --                 'n=100000/d=100'                 --warm-up-time 1                 --measurement-time 2                 --sample-size 20                 --noplot
            )
          done
