name: release

on:
  push:
    tags:
      - "rsos-v*"
      - "rbsr-v*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            tag="${GITHUB_HEAD_REF#release-}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            rsos-v*) package=rsos; expected="${tag#rsos-v}" ;;
            rbsr-v*) package=rbsr; expected="${tag#rbsr-v}" ;;
            *) echo "::error::unsupported tag $tag"; exit 1 ;;
          esac
          actual=$(cargo metadata --no-deps --format-version 1 | python3 -c             'import json,sys; pkg=sys.argv[1]; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == pkg))'             "$package")
          test "$actual" = "$expected"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$actual" >> "$GITHUB_OUTPUT"

      - name: Test package
        run: cargo test -p "${{ steps.tag.outputs.package }}"

      - name: Publish if absent
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          package="${{ steps.tag.outputs.package }}"
          version="${{ steps.tag.outputs.version }}"
          index_url() {
            local name="$1"
            case "${#name}" in
              1) echo "https://index.crates.io/1/$name" ;;
              2) echo "https://index.crates.io/2/$name" ;;
              3) echo "https://index.crates.io/3/${name:0:1}/$name" ;;
              *) echo "https://index.crates.io/${name:0:2}/${name:2:2}/$name" ;;
            esac
          }
          if curl -sS --fail "$(index_url "$package")" 2>/dev/null |
             python3 -c 'import json,sys; v=sys.argv[1]; sys.exit(0 if any(json.loads(line).get("vers") == v for line in sys.stdin if line.strip()) else 1)' "$version"; then
            echo "$package $version is already indexed"
          else
            cargo publish -p "$package"
          fi

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi
