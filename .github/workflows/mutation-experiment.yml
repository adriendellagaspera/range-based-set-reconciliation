name: mutation concurrency cross-shard

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  rsos:
    name: rsos shard ${{ matrix.shard }}/32 (jobs=${{ matrix.local_jobs }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 17]
        local_jobs: [2, 3]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutation-cross-shard-${{ matrix.shard }}-${{ matrix.local_jobs }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Run mutations
        env:
          SHARD: ${{ matrix.shard }}
          LOCAL_JOBS: ${{ matrix.local_jobs }}
        run: |
          set -euo pipefail
          cargo mutants -p rsos \
            --exclude 'rsos/src/counters.rs' \
            --shard "${SHARD}/32" \
            --jobs "${LOCAL_JOBS}" \
            --no-shuffle \
            --caught \
            --unviable
