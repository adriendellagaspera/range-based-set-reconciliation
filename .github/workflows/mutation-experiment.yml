name: mutation profile experiment

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  rsos:
    name: rsos 1/32 (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant: [default, no-debug]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutation-profile-${{ matrix.variant }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Run mutations
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          if test "${VARIANT}" = "no-debug"; then
            export CARGO_PROFILE_TEST_DEBUG=0
          fi
          cargo mutants -p rsos \
            --exclude 'rsos/src/counters.rs' \
            --shard 1/32 \
            --jobs 2 \
            --no-shuffle \
            --caught \
            --unviable
