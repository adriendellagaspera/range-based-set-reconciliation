name: mutation concurrency repeat

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  rsos:
    name: rsos 0/32 (jobs=${{ matrix.local_jobs }}, repeat=${{ matrix.repeat }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        local_jobs: [2, 3]
        repeat: [1, 2]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutation-concurrency-repeat-${{ matrix.local_jobs }}-${{ matrix.repeat }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Run mutations
        env:
          LOCAL_JOBS: ${{ matrix.local_jobs }}
        run: |
          set -euo pipefail
          cargo mutants -p rsos \
            --exclude 'rsos/src/counters.rs' \
            --shard 0/32 \
            --jobs "${LOCAL_JOBS}" \
            --no-shuffle \
            --caught \
            --unviable
