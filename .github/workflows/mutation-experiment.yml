name: mutation determinism experiment

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  inventory:
    name: inventory repeat ${{ matrix.repeat }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Inventory
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -V
          cargo mutants --version
          cargo generate-lockfile
          sha256sum Cargo.lock

          cargo mutants -p rsos \
            --exclude 'rsos/src/counters.rs' \
            --list > mutants.txt

          echo "mutants=$(wc -l < mutants.txt)"
          echo "node_mutants=$(grep -c '^rsos/src/fingerprint_tree_map/node.rs:' mutants.txt || true)"
          sha256sum mutants.txt
