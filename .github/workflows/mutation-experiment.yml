name: mutation rbsr full baseline

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rbsr:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutation-rbsr-full

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Run stable RBSR mutations
        run: |
          set -euo pipefail
          cargo mutants -p rbsr \
            --exclude 'rbsr/src/probe_harness.rs' \
            --exclude 'rbsr/src/policy/constant_stride_split.rs' \
            --exclude 'rbsr/src/policy/span_hashed_stride_split.rs' \
            --exclude-re 'local_for_testing|remote_for_testing' \
            --jobs 2 \
            --no-shuffle \
            --caught \
            --unviable

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-rbsr-full
          path: mutants.out
          if-no-files-found: ignore
