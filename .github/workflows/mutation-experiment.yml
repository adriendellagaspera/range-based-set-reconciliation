name: mutation rsos internal query

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTFLAGS: --cfg rbsr_internal_testing

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Run query mutations with internal counters enabled
        run: |
          set -euo pipefail
          cargo mutants -p rsos \
            --file 'rsos/src/fingerprint_tree_map/query.rs' \
            --test-workspace=true \
            --jobs 2 \
            --no-shuffle \
            --caught \
            --unviable
      - name: Print outcome
        if: always()
        run: test ! -f mutants.out/outcomes.json || cat mutants.out/outcomes.json
