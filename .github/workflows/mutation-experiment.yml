name: mutation test-selection experiment

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  rsos:
    name: rsos shard 0/8 (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [package, workspace]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutation-test-selection-${{ matrix.scope }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Count shard mutants
        run: |
          set -euo pipefail
          cargo mutants -p rsos \
            --exclude 'rsos/src/counters.rs' \
            --shard 0/8 \
            --list > mutants.txt
          echo "mutant_count=$(wc -l < mutants.txt)"
          sha256sum mutants.txt

      - name: Run mutations
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          set -euo pipefail
          args=(
            -p rsos
            --exclude 'rsos/src/counters.rs'
            --shard 0/8
            --jobs 1
            --no-shuffle
            --caught
            --unviable
          )
          if test "${SCOPE}" = workspace; then
            args+=(--test-workspace=true)
          fi
          cargo mutants "${args[@]}"

      - name: Print summary
        if: always()
        run: |
          test ! -f mutants.out/outcomes.json || python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("mutants.out/outcomes.json")
          if p.exists():
              d = json.loads(p.read_text())
              print(json.dumps(d.get("summary", d), sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsos-selection-${{ matrix.scope }}
          path: |
            mutants.txt
            mutants.out
          if-no-files-found: ignore
