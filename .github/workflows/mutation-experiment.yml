name: mutation filter experiment

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  inventory:
    name: inventory filters
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Compare mutant inventories
        run: |
          set -euo pipefail
          cargo mutants -p rsos \
            --exclude 'rsos/src/counters.rs' \
            --list > base.txt

          cargo mutants -p rsos \
            --exclude 'rsos/src/counters.rs' \
            --exclude 'rsos/src/**/tests.rs' \
            --exclude 'rsos/src/**/tests/*.rs' \
            --list > explicit-test-excludes.txt

          echo "base=$(wc -l < base.txt)"
          echo "explicit_test_excludes=$(wc -l < explicit-test-excludes.txt)"

          echo '--- added by explicit test exclusions ---'
          comm -13 <(sort base.txt) <(sort explicit-test-excludes.txt) | tee added.txt
          echo "added=$(wc -l < added.txt)"

          echo '--- removed by explicit test exclusions ---'
          comm -23 <(sort base.txt) <(sort explicit-test-excludes.txt) | tee removed.txt
          echo "removed=$(wc -l < removed.txt)"
