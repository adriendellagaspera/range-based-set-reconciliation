name: mutation baseline

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  inventory:
    name: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Inventory stable and internal corpora
        run: |
          set -euo pipefail
          cargo mutants --version

          cargo mutants -p rsos \
            --exclude 'rsos/src/counters.rs' \
            --list > rsos-stable.txt

          cargo mutants -p rbsr \
            --exclude 'rbsr/src/probe_harness.rs' \
            --exclude 'rbsr/src/policy/constant_stride_split.rs' \
            --exclude 'rbsr/src/policy/span_hashed_stride_split.rs' \
            --exclude-re 'local_for_testing|remote_for_testing' \
            --list > rbsr-stable.txt

          RUSTFLAGS='--cfg rbsr_internal_testing' cargo mutants -p rsos \
            --file 'rsos/src/counters.rs' \
            --list > rsos-internal.txt

          RUSTFLAGS='--cfg rbsr_internal_testing' cargo mutants -p rbsr \
            --file 'rbsr/src/probe_harness.rs' \
            --file 'rbsr/src/policy/constant_stride_split.rs' \
            --file 'rbsr/src/policy/span_hashed_stride_split.rs' \
            --examine-re 'local_for_testing|remote_for_testing|probe_harness|constant_stride_split|span_hashed_stride_split' \
            --list > rbsr-internal.txt

          for f in rsos-stable rbsr-stable rsos-internal rbsr-internal; do
            printf '%s_mutants=%s\n' "$f" "$(wc -l < "$f.txt")"
          done

          cat rsos-stable.txt rbsr-stable.txt | sort > stable-workspace.txt
          printf 'stable_workspace_mutants=%s\n' "$(wc -l < stable-workspace.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: mutation-inventory
          path: |
            *-stable.txt
            *-internal.txt
            stable-workspace.txt
