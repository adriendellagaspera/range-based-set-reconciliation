name: import-history

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Import rsos/rbsr history
        env:
          GH_TOKEN: ${{ github.token }}
          FILTER_BRANCH_SQUELCH_WARNING: "1"
        run: |
          set -euo pipefail
          git clone https://github.com/adriendellagaspera/reconcile-rs source
          cd source
          git checkout main
          git filter-branch --prune-empty --index-filter '
            git ls-files -z |
              grep -zvE "^(rsos|rbsr)/" |
              xargs -0 -r git rm -r --cached --ignore-unmatch
          ' -- main
          git remote add target "https://x-access-token:${GH_TOKEN}@github.com/adriendellagaspera/range-based-set-reconciliation.git"
          git push target refs/heads/main:refs/heads/main --force
