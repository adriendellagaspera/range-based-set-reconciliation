name: mutation baseline-skip experiment

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  compare:
    name: ${{ matrix.target }} / baseline=${{ matrix.baseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [aggregate, query]
        baseline: [run, skip]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Freeze dependencies
        run: |
          set -euo pipefail
          cargo generate-lockfile
          sha256sum Cargo.lock

      - name: Run mutations
        env:
          TARGET: ${{ matrix.target }}
          BASELINE: ${{ matrix.baseline }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            aggregate) file='rsos/src/aggregate.rs' ;;
            query) file='rsos/src/fingerprint_tree_map/query.rs' ;;
            *) exit 2 ;;
          esac

          cargo mutants -p rsos             --file "$file"             --test-workspace=true             --cargo-arg=--locked             --baseline="$BASELINE"             --timeout 90             --jobs 2             --no-shuffle             --caught             --unviable

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-${{ matrix.target }}-${{ matrix.baseline }}
          path: mutants.out
          if-no-files-found: ignore
