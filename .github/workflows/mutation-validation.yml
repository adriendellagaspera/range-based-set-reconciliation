name: rsos aggregate mutation validation

on:
  pull_request:

permissions:
  contents: read

# rerun after bounded traversal refactor v3

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Freeze dependencies
        run: cargo generate-lockfile
      - name: Mutate aggregate implementation
        run: |
          set -euo pipefail
          cargo mutants -p rsos             --file 'rsos/src/fingerprint_tree_map/query.rs'             --test-workspace=true             --cargo-arg=--locked             --jobs 2             --no-shuffle             --caught             --unviable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsos-aggregate-mutants
          path: mutants.out
          if-no-files-found: ignore
